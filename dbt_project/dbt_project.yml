name: payment_analytics
version: "1.0.0"
config-version: 2

profile: payment_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Phase 4 detection thresholds. Kept as vars so they can be tuned from the
# command line (dbt build --vars '{amount_zscore_threshold: 4}') without
# editing SQL — the whole point of a rules engine is that it is tunable.
vars:
  # Velocity: how many transactions from one user inside the window before it
  # looks like a burst. The generator emits bursts of 5-8 within ~90s.
  velocity_window_seconds: 120
  velocity_min_txns: 4

  # Geo: a country change is only suspicious if it happened too fast to be
  # real travel.
  geo_max_gap_seconds: 3600

  # Amount: std devs above the user's own mean.
  amount_zscore_threshold: 3.0

  # Trailing window for the per-user amount baseline. Must be a *trailing*
  # window: scoring a transaction against a mean that includes later
  # transactions is lookahead bias, and no real-time system could do it.
  user_rolling_window_seconds: 86400   # 24h
  # Below this many prior transactions the baseline is too noisy to judge
  # against, so the z-score is null rather than a made-up number.
  min_rolling_observations: 10

  # Window for the per-merchant transaction rate (transactions per minute).
  merchant_rate_window_seconds: 60

models:
  payment_analytics:
    staging:
      # Views: cheap, always current, and the volumes here are small.
      +materialized: view
      +schema: staging
    intermediate:
      # Views too — these exist to keep window logic out of the marts, not to
      # be queried directly.
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  payment_analytics:
    fx_rates_to_eur:
      +column_types:
        currency: STRING
        rate_to_eur: NUMERIC
