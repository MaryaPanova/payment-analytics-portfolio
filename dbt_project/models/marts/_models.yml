version: 2

models:
  - name: fct_transactions
    description: >
      Transaction grain with per-user context (amount z-score, time since the
      user's previous transaction, previous country). Partitioned by date,
      clustered by category and country.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: amount_eur
        data_tests:
          - not_null
      - name: transacted_at
        data_tests:
          - not_null
      - name: amount_zscore_vs_user
        description: Std devs from the user's own mean. 0 when undefined.
        data_tests:
          - not_null
      - name: seconds_since_user_prev_txn
        description: >
          Null for a user's first transaction — that is meaningful, not missing
          data, so this column is intentionally not tested for not_null.

  - name: agg_transactions_hourly
    description: Hourly platform metrics; the dashboard's headline time series.
    columns:
      - name: transacted_hour
        data_tests:
          - unique
          - not_null
      - name: txn_count
        data_tests:
          - not_null
      - name: fraud_rate
        description: fraud_txn_count / txn_count, in [0, 1].
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: fct_transaction_anomalies
    description: >
      Transaction grain with rule-based fraud flags. is_fraud_synthetic is
      carried for scoring only and is not an input to any rule.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: is_flagged
        data_tests:
          - not_null
      - name: rules_triggered
        description: How many of the three rules fired (0-3).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 3
                inclusive: true
      - name: user_txns_in_window
        description: >
          Transactions by this user within velocity_window_seconds, inclusive
          of the row itself — so it is always at least 1.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: agg_anomaly_performance
    description: >
      Precision, recall and F1 per rule, scored against the synthetic label.
      One row per rule plus a combined any_rule row.
    columns:
      - name: rule_name
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["velocity", "geo", "amount", "any_rule"]
      - name: precision_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: recall_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: targeted_recall_score
        description: >
          Recall against only the pattern this rule targets. The meaningful
          per-rule number; recall_score is capped near one third by design.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: agg_merchant_daily
    description: Daily per-merchant volume and fraud rollup.
    columns:
      - name: merchant_id
        data_tests:
          - not_null
      - name: txn_count
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - transacted_date
              - merchant_id
